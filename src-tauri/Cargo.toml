[package]
name = "time-tracker-mobile"
version = "0.5.2"
edition = "2021"

[lib]
name = "time_tracker_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
